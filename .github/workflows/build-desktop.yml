name: Build and release desktop apps

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      build: ${{ steps.release.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        id: release
        with:
          script: |
            const { version } = require('./package.json');
            if (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(version)) throw new Error('Use a stable x.y.z version');
            const tag = `v${version}`;
            if (context.ref.startsWith('refs/tags/') && context.ref !== `refs/tags/${tag}`) throw new Error('Tag must match package.json');
            let published = false;
            try {
              const { data } = await github.rest.repos.getReleaseByTag({ ...context.repo, tag });
              published = !data.draft;
            } catch (error) { if (error.status !== 404) throw error; }
            core.setOutput('version', version);
            core.setOutput('build', String(!published));
            if (published) core.notice(`${tag} is already published. Bump package.json to release an update.`);

  build:
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-2022
            arch: x64
            script: package:win
            artifact: windows-x64
          - name: macOS Apple Silicon
            runner: macos-15
            arch: arm64
            script: package:mac:arm64
            artifact: macos-arm64
          - name: macOS Intel
            runner: macos-15-intel
            arch: x64
            script: package:mac:x64
            artifact: macos-x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          architecture: ${{ matrix.arch }}
          cache: npm
      - name: Install locked dependencies and Electron
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Build for this runner's platform and architecture
        run: npm run ${{ matrix.script }}
      - name: Launch packaged app in an isolated profile
        run: npm run smoke:package
      - name: Upload installable files
        uses: actions/upload-artifact@v4
        with:
          name: turwe-code-${{ matrix.artifact }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
          if-no-files-found: error
          retention-days: 14
      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.artifact }}
          path: release/smoke/*
          if-no-files-found: ignore
          retention-days: 14

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: turwe-code-*
          path: release
          merge-multiple: true
      - name: Validate the complete release and create checksums
        run: node scripts/release-checksums.cjs
      - name: Publish all platforms together
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v$VERSION"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --draft --target "$GITHUB_SHA" --title "Turwe Code $VERSION" --notes-file docs/release-notes.md
          fi
          gh release upload "$tag" release/*.exe release/*.dmg release/*.zip release/SHA256SUMS.txt --clobber
          gh release edit "$tag" --draft=false --latest

